run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: sdd-kafka-producer
  govet:
    check-shadowing: true
  golint:
    min-confidence: 0.8
  misspell:
    locale: US
  gocyclo:
    min-complexity: 10

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofmt
    - goimports
    - misspell
    - gocyclo
    - goconst
    - deadcode
    - varcheck
    - structcheck

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - goconst
  max-issues-per-linter: 50
  max-same-issues: 3